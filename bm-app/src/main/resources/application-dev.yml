server:
  port: 8091
  tomcat:
    threads:
      max: 200  # 设定处理客户请求的线程的最大数目，决定可以同时响应客户请求的数，默认200
      min-spare: 50  # 初始化线程数，最小空闲线程数，默认 10
    accept-count: 10 # 等待队列长度

#应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域
    cross-origin: '*'

spring:
  rabbitmq:
    addresses: 47.112.25.14
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        prefetch: 1 # 每次投递n个消息，消费完在投递n个
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send_award
      send_rebate: send_rebate
      credit_adjust_success: credit_adjust_success

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

