# P0 交付优化 profile：3 个逻辑库各有 72 个 Hikari 连接。
# 许可：TRADE 24 + WORKER 28 + QUERY 8 + RELAY 2 + RECOVERY 2 = 64，另加
# CALLBACK 1（支付回调仍使用该工作类），合计 65 < 72，保留 7 个余量。
# PostgreSQL 实例需设置 max_connections=300（3×72=216 个池连接 + 20 预留 ≤ 240 物理预算）。
server:
  port: 8091
app:
  config:
    api-version: v1
    cross-origin: http://localhost
spring:
  main:
    allow-bean-definition-overriding: false
  rabbitmq:
    host: ${V2_RABBIT_HOST:host.docker.internal}
    port: ${V2_RABBIT_PORT:15686}
    username: bromark_it
    password: ${V2_RABBIT_PASSWORD}
    topic:
      send_award: bromark.it.send_award
      send_rebate: bromark.it.send_rebate
      activity_sku_stock_zero: bromark.it.sku_stock_zero
      credit_adjust_success: bromark.it.credit_success
mini-db-router:
  jdbc:
    datasource:
      dbCount: 2
      tbCount: 4
      routerKey: userId
      default: db00
      list: db01,db02
      global:
        driver-class-name: org.postgresql.Driver
        username: postgres
        password: ${V2_PG_PASSWORD}
        pool:
          maximum-pool-size: 72
          minimum-idle: 0
          connection-timeout: 1000
      db00:
        url: jdbc:postgresql://${V2_PG_HOST:host.docker.internal:15432}/${V2_DB00:pg_control}?connectTimeout=1000&socketTimeout=1000&options=-c%20TimeZone%3DUTC&stringtype=unspecified
      db01:
        url: jdbc:postgresql://${V2_PG_HOST:host.docker.internal:15432}/${V2_DB01:pg_one}?connectTimeout=1000&socketTimeout=1000&options=-c%20TimeZone%3DUTC&stringtype=unspecified
      db02:
        url: jdbc:postgresql://${V2_PG_HOST:host.docker.internal:15432}/${V2_DB02:pg_two}?connectTimeout=1000&socketTimeout=1000&options=-c%20TimeZone%3DUTC&stringtype=unspecified
mybatis:
  mapper-locations: classpath:/mybatis/mapper/**/*.xml
redis:
  sdk:
    config:
      host: ${V2_REDIS_HOST:host.docker.internal}
      port: ${V2_REDIS_PORT:16386}
      pool-size: 4
      min-idle-size: 1
bm:
  v2:
    enabled: true
    # V2 资产写模式 + raffle；入口准入没有代码默认值，P0 启动必须显式给出。
    # 限额按 P0 workload（160 draw/s 等价混合）配置，不是容量结论；max-in-flight
    # 与 TRADE/QUERY/RECOVERY 数据库许可对齐，local-fallback 是 Redis 故障时的保守值。
    asset-write-mode: V2
    raffle:
      enabled: true
    user-rps: 20
    activity-rps: 100
    max-in-flight: 24
    local-fallback-rps: 1
    query-rps: 100
    query-max-in-flight: 8
    cancel-rps: 10
    cancel-max-in-flight: 2
    messaging:
      enabled: true
      prefix: p0
      relay:
        mode: bounded
    budget:
      physical:
        "00": pg-it
        "01": pg-it
        "02": pg-it
      instances:
        pg-it:
          TRADE: 24
          WORKER: 28
          QUERY: 8
          RELAY: 2
          RECOVERY: 2
          # 支付回调仍使用 CALLBACK；代码默认 1，profile 必须显式保留以满足启动校验。
          CALLBACK: 1
      physical-connection-limits:
        pg-it: 240
      reserved-connections: 20
      prefetch: 8
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
