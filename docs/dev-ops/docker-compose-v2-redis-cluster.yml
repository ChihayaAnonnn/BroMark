name: bromark-assets-cluster
x-redis: &redis
  image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
  command: [redis-server, --cluster-enabled, 'yes', --cluster-config-file, nodes.conf, --cluster-node-timeout, '5000', --appendonly, 'no']
  networks: [assets-cluster]
services:
  redis-1:
    <<: *redis
    container_name: bromark-assets-redis-1
  redis-2:
    <<: *redis
    container_name: bromark-assets-redis-2
  redis-3:
    <<: *redis
    container_name: bromark-assets-redis-3
networks:
  assets-cluster:
    name: bromark-assets-cluster-it
    external: true
